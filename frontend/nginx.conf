server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # BarberReserve usa React Router (BrowserRouter). Sin esta regla,
    # recargar la página en una ruta como /dashboard o /agenda daría un
    # 404 de Nginx en lugar de dejar que React Router la resuelva.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los archivos con hash en el nombre (los que genera el build de Vite)
    # pueden cachearse de forma agresiva; index.html nunca, para que los
    # usuarios siempre reciban la referencia más reciente a esos archivos.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
